# ── Force HTTPS first ─────────────────────────────────
if ($scheme = "http") {
    return 301 https://$host$request_uri;
}

# ── Block PHP files ───────────────────────────────────
location ~* \.(php|phtml|phar|env)$ {
    add_header Content-Type text/plain;
    return 403 "Nothing to see";
}

# ── Block XMLRPC ──────────────────────────────────────
location /xmlrpc/ {
    add_header Content-Type text/plain;
    return 403 "Nothing to see";
}

# ── Block WordPress paths ─────────────────────────────
location ~* /(wp-admin|wp-login|wp-content|wp-includes) {
    add_header Content-Type text/plain;
    return 403 "Nothing to see";
}

# ── Block webshells ───────────────────────────────────
location ~* /(shell|cmd|exec|eval|backdoor|c99|r57) {
    add_header Content-Type text/plain;
    return 403 "Nothing to see";
}
