services:
  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    image: custom18:latest
    container_name: erp18
    restart: unless-stopped

    # ── Least Privilege ──────────────────────────────
    user: odoo                     # non-root odoo user from the image
    read_only: false               # odoo needs write access
    security_opt:
      - no-new-privileges:true     # prevent privilege escalation
    cap_drop:
      - ALL                        # drop ALL capabilities
    cap_add:
      - NET_BIND_SERVICE           # only add what's needed

    # ── Ports (localhost only, NPM proxies) ──────────
    ports:
      - "127.0.0.1:8059:8069"
      - "127.0.0.1:8062:8072"      # longpolling / websocket

    # ── Volumes ──────────────────────────────────────
    volumes:
      - ./config:/etc/odoo
      - ./custom-addons:/mnt/custom-addons
      - ./extra-addons:/mnt/extra-addons
      - ./odoo-data:/var/lib/odoo/.local/share/Odoo   # filestore, owned by odoo uid

    # ── Environment ──────────────────────────────────
    environment:
      - HOST=172.18.0.1
      - PORT=5432
      - USER=erp18
      - PASSWORD=kkHOzy0T7hfl

    # ── Health Check ─────────────────────────────────
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    # ── Logging ──────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    # ── Network ──────────────────────────────────────
    networks:
      - odoo-network

networks:
  odoo-network:
    external: true
