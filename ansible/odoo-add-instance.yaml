---
# Adds a new Odoo instance to a machine that already has the base setup:
# Docker, PostgreSQL, odoo-network, and Nginx Proxy Manager running.
# # Usage:
#   #ansible-playbook -i inventory.ini odoo-add-instance.yaml -e "odoo_version=18 odoo_port=8060 odoo_gevent_port=8073 postgres_user=cetmix18 postgres_password=tOtE4nX8Rf0b5g admin_passwd=wxLgnhKXLx45oD odoo_container_name=cetmix18 " --limit o4open --check

- name: Add New Odoo Instance
  hosts: all
  gather_facts: yes
  become: yes
  vars:
    odoo_version: "16"
    odoo_image_tag: "latest"
    odoo_container_name: "odoo{{ odoo_version }}"
    odoo_custom_image: "custom{{ odoo_version }}:{{ odoo_image_tag }}"
    # Must be unique per instance on the same machine
    odoo_port: "8070"
    odoo_gevent_port: "8073"
    # Database configuration
    postgres_user: "odoo{{ odoo_version }}"
    postgres_password: "changeme"
    postgres_host: "172.18.0.1"
    # Odoo master password
    admin_passwd: "changeme"
    # Existing network — must already exist
    docker_network_name: "odoo-network"
    docker_subnet: "172.18.0.0/24"
    # Directory structure
    docker_base_dir: "/opt/docker"
    odoo_user_dir: "{{ docker_base_dir }}/{{ postgres_user }}"


  tasks:
    - name: Display new instance setup information
      debug:
        msg: |
          Adding Odoo {{ odoo_version }} instance on {{ inventory_hostname }}
          Container: {{ odoo_container_name }}
          Image: {{ odoo_custom_image }}
          Odoo port: {{ odoo_port }}  |  Gevent port: {{ odoo_gevent_port }}
          Database User: {{ postgres_user }}
          Directory: {{ odoo_user_dir }}

    # Step 1: Create system user for Odoo
    - name: Create system user for Odoo
      user:
        name: "{{ postgres_user }}"
        home: "/home/{{ postgres_user }}"
        create_home: yes
        system: yes
        shell: /bin/bash
        state: present

    # Step 2: Create PostgreSQL user for this instance
    - name: Create PostgreSQL user
      become_user: postgres
      postgresql_user:
        name: "{{ postgres_user }}"
        password: "{{ postgres_password }}"
        role_attr_flags: CREATEDB
        state: present

    - name: Get PostgreSQL hba file path
      become_user: postgres
      command: psql -t -A -c "SHOW hba_file"
      register: postgres_hba_path_raw
      changed_when: false
      check_mode: no

    - name: Add pg_hba.conf entry for this instance
      lineinfile:
        path: "{{ postgres_hba_path_raw.stdout | trim }}"
        insertafter: '# IPv4 local connections:'
        line: "host    all             {{ postgres_user }}             {{ docker_subnet }}          md5"
        backup: yes
      notify: restart postgresql

    - name: Flush handlers to apply pg_hba.conf changes
      meta: flush_handlers

    - name: Wait for PostgreSQL to be ready
      wait_for:
        port: 5432
        host: localhost
        delay: 3
        timeout: 30

    # Step 3: Create directory structure
    - name: Create instance directory structure
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ odoo_user_dir }}"
        - "{{ odoo_user_dir }}/config"
        - "{{ odoo_user_dir }}/custom-addons"
        - "{{ odoo_user_dir }}/extra-addons"
        - "{{ odoo_user_dir }}/odoo-data"
        - "{{ odoo_user_dir }}/script"

    # Step 4: Create Dockerfile and build image
    - name: Create Dockerfile
      template:
        src: templates/Dockerfile.j2
        dest: "{{ odoo_user_dir }}/Dockerfile"
      register: dockerfile

    - name: Check if custom image already exists
      command: docker images {{ odoo_custom_image }} --format "{{ '{{' }}.Repository{{ '}}' }}:{{ '{{' }}.Tag{{ '}}' }}"
      register: image_check
      changed_when: false

    - name: Build custom Odoo Docker image
      command: docker build -t {{ odoo_custom_image }} .
      args:
        chdir: "{{ odoo_user_dir }}"
      when: odoo_custom_image not in image_check.stdout or dockerfile.changed

    # The container runs as the image's non-root "odoo" user, so the bind-mounted
    # filestore must be owned by that UID/GID (not root) for Odoo to write to it.
    - name: Get odoo user UID from the image
      command: docker run --rm --entrypoint id {{ odoo_custom_image }} -u odoo
      register: odoo_uid_out
      changed_when: false

    - name: Get odoo group GID from the image
      command: docker run --rm --entrypoint id {{ odoo_custom_image }} -g odoo
      register: odoo_gid_out
      changed_when: false

    - name: Set ownership of odoo-data to the odoo user
      file:
        path: "{{ odoo_user_dir }}/odoo-data"
        state: directory
        owner: "{{ odoo_uid_out.stdout | trim }}"
        group: "{{ odoo_gid_out.stdout | trim }}"
        mode: 'u=rwX,g=rX,o='
        recurse: yes

    # Step 5: Create docker-compose.yaml
    - name: Create docker-compose.yaml
      template:
        src: templates/docker-compose.yaml.j2
        dest: "{{ odoo_user_dir }}/docker-compose.yaml"

    # Step 6: Create odoo.conf
    - name: Create Odoo configuration file
      template:
        src: templates/odoo.conf.j2
        dest: "{{ odoo_user_dir }}/config/odoo.conf"

    # Step 7: Start the new Odoo instance
    - name: Stop existing container if running
      command: docker compose down
      args:
        chdir: "{{ odoo_user_dir }}"
      ignore_errors: yes

    - name: Start Odoo instance
      command: docker compose up -d --build
      args:
        chdir: "{{ odoo_user_dir }}"

    - name: Wait for Odoo to be ready
      wait_for:
        port: "{{ odoo_port }}"
        host: "127.0.0.1"   # Odoo ports are bound to localhost only
        delay: 30
        timeout: 300
      ignore_errors: yes

    - name: Verify container status
      command: docker ps --filter name={{ odoo_container_name }} --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}\t{{ '{{' }}.Ports{{ '}}' }}"
      register: container_status
      changed_when: false

    - name: Display setup completion message
      debug:
        msg: |
          Odoo {{ odoo_version }} instance is up!

          Container: {{ odoo_container_name }}
          Odoo URL: http://127.0.0.1:{{ odoo_port }} (server-local only, public access via NPM)
          Database User: {{ postgres_user }}
          Directory: {{ odoo_user_dir }}

          {{ container_status.stdout }}

          Next steps in Nginx Proxy Manager (http://<server>:81):
          - Add a Proxy Host → Forward to {{ odoo_container_name }}:8069
          - Enable Websockets Support
          - Add /websocket location → {{ odoo_container_name }}:8072
          - Add the Custom Locations and Advanced tab config below to the Proxy Host

          ===== Custom Locations tab =====

          Location 1 - Main proxy
          Location: /    Scheme: http    Forward Hostname: {{ odoo_container_name }}    Forward Port: 8069
          Custom config:

            proxy_redirect          off;
            proxy_set_header        X-Forwarded-Host    $host;
            proxy_set_header        X-Real-IP           $remote_addr;
            proxy_set_header        X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto   https;
            proxy_http_version      1.1;
            proxy_set_header        Upgrade             $http_upgrade;
            proxy_set_header        Connection          "upgrade";

          Location 2 - Static file caching
          Location: ~* /web/static/    Scheme: http    Forward Hostname: {{ odoo_container_name }}    Forward Port: 8069
          Custom config:

            proxy_cache_valid   200 60m;
            proxy_buffering     on;
            expires             864000;

          ===== Advanced tab (Custom Nginx Configuration) =====

            # Global IP and agent blocks
            if ($block_ip) { return 403 "Nothing to see"; }
            if ($block_agent) { return 403 "Nothing to see"; }

            # Include location rules
            include /data/nginx/custom/odoo_security.conf;

  handlers:
    - name: restart postgresql
      systemd:
        name: postgresql
        state: restarted
